[tools]
bun = "1.4.2"
node = "24.21.0"

[tasks.install]
description = "Install the locked dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Check lint rules and formatting, Markdown included"
run = ["bunx oxlint --deny-warnings", "bunx oxfmt --check ."]

[tasks.fix]
description = "Apply safe lint fixes and format the repository"
run = ["bunx oxlint --fix", "bunx oxfmt ."]

[tasks.typecheck]
description = "Type-check the project"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run the tests against in-process Postgres"
# Several tests boot their own in-process Postgres and hash passwords, which
# takes longer than bun's 5 second default on a loaded machine.
run = "bun test --timeout 30000"

[tasks.build]
description = "Build the production site"
wait_for = ["typecheck"]
run = "bunx next build"

[tasks.check]
description = "Run every check CI runs"
depends = ["lint", "typecheck", "test", "build"]

[tasks.dev]
description = "Start the development server"
run = "bunx next dev --turbopack"

[tasks.start]
description = "Start the production server"
run = "bunx next start"

[tasks."db:generate"]
description = "Generate a migration from src/db/schema.ts"
run = "bunx drizzle-kit generate"

[tasks."db:migrate"]
description = "Apply the committed migrations to DATABASE_URL"
run = "bun scripts/migrate.ts"

[tasks."db:seed"]
description = "Create the first admin from SEED_ADMIN_EMAIL and SEED_ADMIN_PASSWORD"
run = "bun scripts/seed-admin.ts"
